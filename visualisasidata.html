<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petualangan Struktur Data — Pertemuan 5: Visualisasi Data</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#F0F7FF;
  --panel:#FFFFFF;
  --panel2:#EFF6FF;
  --text:#172554;
  --muted:#64748B;
  --accent:#3B82F6;
  --accent2:#8B5CF6;
  --gold:#FBBF24;
  --danger:#F472B6;
  --success:#22C55E;
  --pink:#F472B6;
  --purple:#8B5CF6;
  --border:rgba(37,99,235,.14);
  --shadow:0 18px 50px rgba(37,99,235,.12)
}
html,body{margin:0;width:100%;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#F0F7FF 0%,#FDFBFF 52%,#FFF7FC 100%);color:var(--text);overflow:hidden}
button{font:inherit}
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:270px 1fr;grid-template-rows:64px 1fr 70px}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 22px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);box-shadow:0 4px 18px rgba(37,99,235,.07);z-index:5}
.brand{font-weight:800;white-space:nowrap}.brand span{color:var(--accent2)}
.progress-wrap{flex:1;height:8px;background:#DBEAFE;border-radius:99px;overflow:hidden}
.progress{height:100%;width:6.25%;background:linear-gradient(90deg,#3B82F6,#8B5CF6,#F472B6);border-radius:99px;transition:.3s}
.counter{font-size:13px;color:var(--muted);white-space:nowrap}
.sidebar{background:rgba(255,255,255,.92);border-right:1px solid var(--border);box-shadow:4px 0 18px rgba(37,99,235,.06);padding:18px 12px;overflow:auto}
.sidebar-title{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);padding:0 10px 12px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{border:1px solid transparent;background:transparent;color:#475569;text-align:left;padding:10px 11px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px}
.nav button:hover{background:#EFF6FF;color:#172554}
.nav button.active{background:linear-gradient(90deg,#DBEAFE,#F3E8FF);border-color:rgba(139,92,246,.24);color:#172554}
.num{width:25px;height:25px;border-radius:8px;background:#E0E7FF;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.nav button.active .num{background:linear-gradient(135deg,#3B82F6,#8B5CF6);color:#FFFFFF}
.stage{position:relative;min-width:0;min-height:0;padding:24px;background:
 radial-gradient(circle at 85% 10%,rgba(59,130,246,.16),transparent 30%),
 radial-gradient(circle at 15% 90%,rgba(244,114,182,.12),transparent 28%),
 radial-gradient(circle at 55% 95%,rgba(139,92,246,.08),transparent 25%)}
.slide{height:100%;width:100%;max-width:1180px;margin:auto;background:linear-gradient(145deg,#FFFFFF,#F8FBFF);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);overflow:auto}
.slide-inner{min-height:100%;padding:46px 56px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{color:var(--accent);font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
h1{font-size:clamp(34px,5vw,64px);line-height:1.03;margin:0 0 18px;letter-spacing:-2px}
h2{font-size:clamp(28px,4vw,44px);margin:0 0 18px;letter-spacing:-1px}
h3{margin:0 0 8px;font-size:19px}
p{font-size:17px;line-height:1.7;color:#475569;margin:8px 0}
.lead{font-size:20px;max-width:800px;color:#475569}
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:35px;align-items:center}
.hero-art{min-height:330px;border-radius:24px;background:linear-gradient(145deg,#DBEAFE,#F3E8FF 52%,#FCE7F3);border:1px solid var(--border);box-shadow:inset 0 0 40px rgba(255,255,255,.55);display:grid;place-items:center;position:relative;overflow:hidden}
.hero-art:before,.hero-art:after{content:"";position:absolute;border-radius:50%;filter:blur(2px)}
.hero-art:before{width:190px;height:190px;background:rgba(59,130,246,.18);top:-60px;right:-40px}
.hero-art:after{width:160px;height:160px;background:rgba(244,114,182,.18);bottom:-50px;left:-30px}
.tree-art{position:relative;width:270px;height:230px}
.dot{position:absolute;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#FFFFFF;border:3px solid var(--accent);color:#172554;box-shadow:0 8px 18px rgba(59,130,246,.16);font-weight:800;z-index:2}
.line{position:absolute;height:3px;background:#93C5FD;transform-origin:left center;z-index:1}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.card{background:#FFFFFF;border:1px solid var(--border);box-shadow:0 8px 24px rgba(37,99,235,.08);border-radius:16px;padding:20px}
.card .icon{font-size:28px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.list{padding-left:20px;color:#475569;line-height:1.9;font-size:16px}
.highlight{border-left:4px solid var(--accent);background:#ECFDF5;padding:15px 18px;border-radius:0 12px 12px 0;margin:15px 0}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#EEF6FF;border:1px solid #BFDBFE;padding:18px;border-radius:14px;color:#1D4ED8;box-shadow:inset 0 2px 8px rgba(59,130,246,.04);font-size:18px}
.center{text-align:center}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:99px;background:#F3E8FF;color:#5B21B6;border:1px solid #DDD6FE;font-size:12px;margin:3px}
.term{color:var(--accent);font-weight:800}
.footer{grid-column:1/-1;background:rgba(255,255,255,.96);border-top:1px solid var(--border);box-shadow:0 -4px 18px rgba(37,99,235,.06);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:5}
.footer-info{font-size:13px;color:var(--muted)}
.controls{display:flex;gap:9px}
.btn{border:1px solid var(--border);background:#FFFFFF;color:#172554;border-color:#BFDBFE;padding:11px 17px;border-radius:11px;cursor:pointer;font-weight:700}
.btn:hover{background:#DBEAFE}
.btn.primary{background:linear-gradient(135deg,#3B82F6,#8B5CF6);color:#FFFFFF;border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.quiz-box{background:#FFFFFF;border:1px solid #BFDBFE;box-shadow:0 10px 28px rgba(37,99,235,.08);border-radius:18px;padding:24px;margin-top:16px}
.question{font-size:20px;font-weight:750;line-height:1.45;margin-bottom:16px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option{padding:14px;border:1px solid #2a3854;background:#F8FAFC;color:#172554;border-color:#CBD5E1;border-radius:12px;text-align:left;cursor:pointer}
.option:hover{border-color:#60A5FA}
.data-card{cursor:grab}
.data-card:active{cursor:grabbing}
.drop-zone{transition:.2s;border:2px dashed #93C5FD}
.drop-zone.over{border-color:#3B82F6;background:#EFF6FF;transform:translateY(-2px)}
.drop-items .data-card{padding:7px 10px;font-size:12px;cursor:default}
.activity-note{font-size:13px;color:var(--muted)}

.option.correct{border-color:#3B82F6;background:rgba(59,130,246,.18)}
.option.wrong{border-color:var(--danger);background:rgba(251,113,133,.10)}
.feedback{min-height:25px;margin-top:14px;font-weight:700}
.array{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0}
.array-item{width:72px;height:72px;background:#FFFFFF;border:2px solid #BFDBFE;box-shadow:0 6px 16px rgba(37,99,235,.08);border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.array-item .idx{font-size:10px;color:var(--muted)}.array-item .val{font-weight:800;font-size:20px}
.node-board{position:relative;height:290px;border-radius:18px;background:linear-gradient(135deg,#EFF6FF,#FDF4FF);border:1px solid #BFDBFE;margin-top:18px;overflow:hidden}
.node{position:absolute;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#FFFFFF;border:3px solid #8B5CF6;color:#312E81;box-shadow:0 7px 18px rgba(139,92,246,.15);font-weight:800;cursor:pointer;user-select:none}
.node.selected{border-color:var(--gold);box-shadow:0 0 0 5px rgba(251,191,36,.18),0 8px 20px rgba(251,191,36,.18)}
.node.connected{border-color:#3B82F6}
.svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.edge{stroke:#94A3B8;stroke-width:3}
.mode{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
.result{font-size:25px;font-weight:850;color:var(--accent);margin-top:12px}
.big-check{font-size:80px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:center}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:11px;border-bottom:1px solid var(--border);text-align:left;color:#475569}
th{color:var(--accent)}
@media(max-width:850px){
 .app{grid-template-columns:1fr;grid-template-rows:58px 1fr 66px}
 .sidebar{display:none}.topbar{padding:0 13px}.brand{font-size:13px}
 .stage{padding:10px}.slide{border-radius:16px}.slide-inner{padding:28px 22px}
 .hero,.two-col,.grid2{grid-template-columns:1fr}.cards,.grid3{grid-template-columns:1fr}
 .options{grid-template-columns:1fr}.footer{padding:0 12px}.footer-info{display:none}
}

/* Fun Learning visual layer */
.slide-inner > .eyebrow{
  display:inline-flex;
  width:max-content;
  padding:7px 12px;
  border-radius:999px;
  background:linear-gradient(90deg,#DBEAFE,#F3E8FF);
  color:#4C1D95;
  box-shadow:0 4px 12px rgba(139,92,246,.08);
}
.card{
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 28px rgba(37,99,235,.12);
  border-color:#93C5FD;
}
.btn{
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
}
.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(37,99,235,.12);
}
.btn.primary{
  background:linear-gradient(135deg,#3B82F6,#8B5CF6);
  box-shadow:0 7px 18px rgba(59,130,246,.22);
}
.highlight{
  border-left:5px solid #FBBF24;
  background:linear-gradient(90deg,#FFFBEB,#FFF7ED);
  box-shadow:0 6px 18px rgba(251,191,36,.08);
}
.question{color:#172554}
.result{color:#16A34A}
.term{color:#7C3AED}

/* Peta konsep (slide Rangkuman) */
.cm-wrap{overflow-x:auto;margin:4px -6px 0;padding:0 6px}
.cm-svg{display:block;width:100%;min-width:760px;height:auto}
.cm-node{opacity:0;transform:translateY(8px);animation:cmIn .5s ease forwards;animation-delay:var(--d,0s)}
.cm-line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1;animation:cmDraw .6s ease forwards;animation-delay:var(--d,0s)}
@keyframes cmIn{to{opacity:1;transform:none}}
@keyframes cmDraw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.cm-node{animation:none;opacity:1;transform:none}.cm-line{animation:none;stroke-dashoffset:0}}

/* Buka/tutup menu samping & bar atas */
.sidebar{grid-column:1;grid-row:2;min-width:0;transition:opacity .2s ease}
.stage{grid-column:2;grid-row:2}
.topbar{grid-row:1;min-height:0;overflow:hidden;transition:opacity .2s ease}
.footer{grid-row:3}
.app{transition:grid-template-columns .28s ease,grid-template-rows .28s ease}
.app.no-sidebar{grid-template-columns:0px 1fr}
.app.no-top{grid-template-rows:0px 1fr 70px}
.app.no-sidebar .sidebar{opacity:0;visibility:hidden;padding-left:0;padding-right:0;border-right-width:0;box-shadow:none;overflow:hidden;transition:opacity .15s ease,visibility 0s linear .28s}
.app.no-top .topbar{opacity:0;visibility:hidden;border-bottom-width:0;box-shadow:none;transition:opacity .15s ease,visibility 0s linear .28s}
.footer-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.footer-info{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:6px}
.btn.sm{padding:8px 12px;font-size:13px;white-space:nowrap;flex:none}
.btn.toggle[aria-pressed="true"]{background:#EDE9FE;border-color:#C4B5FD;color:#4C1D95}
.btn:focus-visible{outline:3px solid #93C5FD;outline-offset:2px}
@media(max-width:850px){
 .stage{grid-column:1}
 .app.no-sidebar{grid-template-columns:1fr}
 .app.no-top{grid-template-rows:0px 1fr 66px}
 #toggleSidebar{display:none}
 .toggle .tl{display:none}
 .btn.sm{padding:9px 12px}
}

/* ===== Tampilan HP: menu geser (drawer), peta konsep vertikal, perbaikan layout ===== */
.sidebar-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.drawer-close{display:none;flex:none;width:40px;height:40px;margin:-6px -4px 0 0;border:1px solid #BFDBFE;background:#fff;color:#172554;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;place-items:center}
.scrim{display:none}
.cmm{display:none}
.cmm{max-width:560px;margin:8px auto 0}
.cmm-root{border-radius:18px;padding:10px 14px;text-align:center;color:#fff;font-weight:800;font-size:20px;line-height:1.15;background:linear-gradient(135deg,#3B82F6,#8B5CF6);box-shadow:0 6px 18px rgba(59,130,246,.22)}
.cmm-root small{display:block;font-size:12px;font-weight:500;opacity:.92}
.cmm-kids{margin-left:20px;padding:14px 0 0 14px}
.cmm-branch{position:relative;--c:#3B82F6;--f:#DBEAFE;--p:#F1F7FF;--t:#1E3A8A}
.cmm-branch+.cmm-branch{margin-top:14px}
.cmm-branch:before{content:"";position:absolute;left:-14px;top:51px;width:14px;height:3px;border-radius:3px;background:var(--c)}
.cmm-branch:after{content:"";position:absolute;left:-14px;top:-14px;width:3px;height:calc(100% + 14px);border-radius:3px;background:var(--c)}
.cmm-branch:last-child:after{height:65px}
.b-blue{--c:#3B82F6;--f:#DBEAFE;--p:#F1F7FF;--t:#1E3A8A}
.b-purple{--c:#8B5CF6;--f:#EDE9FE;--p:#F5F3FF;--t:#4C1D95}
.b-green{--c:#22C55E;--f:#DCFCE7;--p:#F3FCF6;--t:#14532D}
.b-pink{--c:#F472B6;--f:#FCE7F3;--p:#FEF3F9;--t:#831843}
.cmm-link{display:block;width:max-content;max-width:100%;height:20px;line-height:17px;margin-bottom:5px;padding:0 10px;border-radius:999px;background:#fff;border:1.3px solid var(--c);color:var(--t);font-size:11.5px;font-weight:700}
.cmm-head{min-height:52px;box-sizing:border-box;padding:6px 12px;border-radius:16px;background:var(--f);border:2px solid var(--c);color:var(--t);display:flex;flex-direction:column;justify-content:center;font-weight:800;font-size:16px;line-height:1.2;box-shadow:0 4px 12px rgba(37,99,235,.10)}
.cmm-head small{font-size:12px;font-weight:500;color:#475569}
.cmm-panel{margin-top:8px;padding:10px;border-radius:16px;border:1.5px dashed var(--c);background:var(--p);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmm-chip{background:#fff;border:1.5px solid var(--c);border-radius:12px;padding:8px 6px;text-align:center;color:var(--t);font-weight:800;font-size:13.5px;line-height:1.2;display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(37,99,235,.10)}
.cmm-chip small{display:block;margin-top:2px;font-size:11.5px;font-weight:500;color:#64748B}
.cmm-chip.wide{grid-column:1/-1}
.cm-slide{margin:-20px 0}

@media(max-width:850px){
 /* menu geser */
 .sidebar{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);z-index:40;padding:14px 12px;background:#fff;overflow-y:auto;overscroll-behavior:contain;transform:translateX(-102%);visibility:hidden;box-shadow:none;transition:transform .28s ease,visibility 0s linear .28s}
 .app.no-sidebar .sidebar{opacity:1;padding-left:12px;padding-right:12px;border-right-width:1px}
 .app.drawer-open .sidebar{transform:none;visibility:visible;box-shadow:8px 0 40px rgba(15,23,42,.28);transition:transform .28s ease,visibility 0s}
 .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:opacity .25s ease}
 .app.drawer-open .scrim{opacity:1;pointer-events:auto}
 .drawer-close{display:grid}
 .nav button{padding:13px 12px;font-size:15px;gap:12px}
 .num{width:28px;height:28px}
 /* tombol footer: ikon saja, mudah disentuh */
 #toggleSidebar{display:inline-flex}
 .btn.sm{min-width:44px;min-height:44px;padding:0 12px;align-items:center;justify-content:center;font-size:16px}
 .footer .controls{gap:6px}
 .footer .controls .btn{min-height:44px;padding:0 11px;font-size:13.5px;white-space:nowrap}
 .footer-left{flex:none}
 /* peta konsep: versi vertikal */
 .cm-wrap{display:none}
 .cmm{display:block}
 .cm-slide{margin:0}
 /* label kecil tidak keluar dari kartu */
 .slide-inner > .eyebrow{width:fit-content;max-width:100%;line-height:1.35;white-space:normal}
 /* game hubungkan node: posisi node muat di layar sempit */
 #nodeGame .node[data-node="A"]{left:5%!important;top:40%!important}
 #nodeGame .node[data-node="B"]{left:30%!important;top:8%!important}
 #nodeGame .node[data-node="C"]{left:56%!important;top:40%!important}
 #nodeGame .node[data-node="D"]{left:calc(95% - 62px)!important;top:66%!important}
 .app{grid-template-rows:58px 1fr 66px}
 .app.no-top{grid-template-rows:0px 1fr 66px}
}
/* HP kecil (<= 380px) */
@media(max-width:380px){
 .btn.sm{min-width:40px}
 .footer{padding:0 8px}
 .footer-left{gap:6px}
 .footer .controls{gap:5px}
 .footer .controls .btn{padding:0 8px;font-size:12.5px}
}
@media(max-width:380px){.topbar{gap:10px}.brand{font-size:12px}.progress-wrap{min-width:36px}}
@media(max-width:340px){#toggleTop{display:none}}
/* HP mode landscape (layar pendek) */
@media(max-width:850px) and (max-height:480px){
 .app{grid-template-rows:44px 1fr 56px}
 .app.no-top{grid-template-rows:0px 1fr 56px}
 .stage{padding:6px}
 .slide-inner{padding:18px 22px}
 .btn.sm{min-height:40px}.footer .controls .btn{min-height:40px}
}

/* ================= PERTEMUAN 4 : komponen baru ================= */
.xp{font-size:13px;font-weight:800;color:#92400E;background:#FEF3C7;border:1px solid #FDE68A;padding:5px 11px;border-radius:99px;white-space:nowrap;transition:transform .2s}
.xp.pop{transform:scale(1.2)}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,18px);background:#172554;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:80;box-shadow:0 10px 30px rgba(15,23,42,.3);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.burst{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.burst span{position:absolute;top:-30px;animation:fall 2.1s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.9}}
.grad{background:linear-gradient(90deg,#3B82F6,#8B5CF6,#F472B6);-webkit-background-clip:text;background-clip:text;color:transparent}
.split{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:26px;align-items:start}
.split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.panel{background:#fff;border:1px solid #BFDBFE;border-radius:18px;padding:16px;box-shadow:0 10px 28px rgba(37,99,235,.08);min-width:0}
.panel.soft{background:linear-gradient(135deg,#EFF6FF,#FDF4FF)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.row.mt{margin-top:12px}
.btn.big{padding:14px 22px;font-size:16px}
.tiny{font-size:13px;color:var(--muted);line-height:1.5;margin:6px 0}
.pills{margin:8px -3px 4px}
.slide h2{margin-bottom:10px}
.lead2{font-size:18px;line-height:1.65;color:#475569;margin:0 0 10px}
.feedback.good{color:#15803D}.feedback.bad{color:#BE185D}
.feedback{font-size:15px;line-height:1.55}
.tline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.tline span{padding:7px 12px;border-radius:99px;font-weight:800;font-size:13px;background:#E0E7FF;color:#3730A3}
.tline span.cur{background:linear-gradient(135deg,#3B82F6,#8B5CF6);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid #BFDBFE;background:#fff;color:#172554;padding:9px 14px;border-radius:99px;font-weight:800;font-size:14px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.chip:hover{border-color:#60A5FA;transform:translateY(-1px)}
.chip.on{background:linear-gradient(135deg,#3B82F6,#8B5CF6);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(99,102,241,.28)}
.chip.used{opacity:.35;pointer-events:none}
.chip.ok{background:#DCFCE7;border-color:#22C55E;color:#14532D}
.chip.bad{background:#FEE2E2;border-color:#F87171;color:#7F1D1D}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tab{border:2px solid #E0E7FF;background:#fff;color:#475569;padding:9px 14px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer}
.tab.on{border-color:#8B5CF6;background:linear-gradient(90deg,#DBEAFE,#F3E8FF);color:#172554}
.tab.done::after{content:" ✓";color:#16A34A}
.infobox{background:#fff;border:2px solid #C7D2FE;border-radius:16px;padding:14px 16px;min-height:76px}
.infobox h3{margin:0 0 6px;font-size:18px}
.infobox p{margin:4px 0;font-size:15.5px;line-height:1.6}
.dots{display:flex;gap:6px;margin:10px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:#DBEAFE;transition:.2s}
.dots i.on{background:#3B82F6;transform:scale(1.25)}
.dots i.done{background:#22C55E}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:800;margin:1px 2px;border:1.5px solid}
.tag.gold{background:#FEF3C7;border-color:#F59E0B;color:#92400E}.tag.green{background:#DCFCE7;border-color:#22C55E;color:#14532D}
.tag.gray{background:#F1F5F9;border-color:#94A3B8;color:#334155}
.story{background:linear-gradient(135deg,#FFFBEB,#FFF7ED);border:1px solid #FDE68A;border-radius:14px;padding:12px 16px;font-size:15.5px;line-height:1.65;color:#78350F}
.story b{color:#92400E}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.hud .pillx{background:#F3E8FF;color:#5B21B6;border:1px solid #DDD6FE;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:800}
.cklist{list-style:none;padding:0;margin:8px 0}
.cklist li{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border:1.5px solid #E0E7FF;border-radius:11px;margin:5px 0;background:#fff;font-size:14.5px;line-height:1.45}
.cklist li i{font-style:normal;width:22px;height:22px;border-radius:7px;border:2px solid #A5B4FC;flex:none;display:grid;place-items:center;color:#fff;font-size:13px}
.cklist li.done{background:#F0FDF4;border-color:#22C55E}.cklist li.done i{background:#22C55E;border-color:#22C55E}
.lamp{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:1.5px solid #E0E7FF;background:#fff;font-size:14.5px;margin:6px 0;font-weight:650}
.lamp i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#fff;background:#94A3B8;flex:none}
.lamp.ok{border-color:#22C55E;background:#F0FDF4}.lamp.ok i{background:#22C55E}
.lamp.no{border-color:#FCA5A5;background:#FEF2F2}.lamp.no i{background:#EF4444}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1.5px solid #E0E7FF;border-radius:12px;margin:6px 0;cursor:pointer;background:#fff;font-size:15px}
.check.on{background:#F0FDF4;border-color:#22C55E}
.check i{width:22px;height:22px;border-radius:7px;border:2px solid #A5B4FC;flex:none;display:grid;place-items:center;font-style:normal;font-size:14px;color:#fff}
.check.on i{background:#22C55E;border-color:#22C55E}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.bdg{border:2px dashed #CBD5E1;border-radius:16px;padding:12px;text-align:center;background:#F8FAFC;color:#94A3B8;filter:grayscale(1);transition:.3s;cursor:pointer}
.bdg.got{border:2px solid #F59E0B;background:linear-gradient(145deg,#FFFBEB,#FEF3C7);color:#78350F;filter:none;box-shadow:0 10px 24px rgba(245,158,11,.2)}
.bdg .e{font-size:34px}.bdg b{display:block;font-size:14px}.bdg small{font-size:12px}
.qwrap{background:#fff;border:1px solid #BFDBFE;border-radius:18px;padding:18px;box-shadow:0 10px 28px rgba(37,99,235,.08)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;font-weight:800;color:#64748B}
.qbar{height:8px;background:#DBEAFE;border-radius:99px;overflow:hidden;margin-bottom:12px}.qbar i{display:block;height:100%;background:linear-gradient(90deg,#3B82F6,#8B5CF6);transition:.3s}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.qopt{padding:13px 14px;border:2px solid #CBD5E1;background:#F8FAFC;border-radius:12px;text-align:left;cursor:pointer;color:#172554;font-weight:650;font-size:15px}
.qopt:hover{border-color:#60A5FA}.qopt.right{border-color:#16A34A;background:#DCFCE7}.qopt.wrong{border-color:#F87171;background:#FEE2E2}
.qopt:disabled{cursor:default}
.score-big{font-size:56px;font-weight:900;line-height:1}
.bars{display:grid;gap:8px;margin:10px 0}
.bars div{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:14px;font-weight:700}
.bars i{display:block;height:12px;border-radius:99px;background:#E0E7FF;overflow:hidden}.bars i u{display:block;height:100%;background:linear-gradient(90deg,#22C55E,#3B82F6)}
.numin{border:2px solid #C7D2FE;border-radius:10px;padding:9px 12px;font-size:16px;font-weight:800;width:120px;color:#172554}
.numin:focus{outline:none;border-color:#3B82F6}

/* ---- Tabel data ---- */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px;border:1.5px solid #E0E7FF}
.dtbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;background:#fff}
.dtbl th{background:#EEF2FF;color:#3730A3;font-weight:800;padding:9px 12px;text-align:left;white-space:nowrap;position:sticky;top:0}
.dtbl th.sortable{cursor:pointer}
.dtbl th.sort-asc::after{content:' ▲';font-size:10px}.dtbl th.sort-desc::after{content:' ▼';font-size:10px}
.dtbl td{padding:8px 12px;border-bottom:1px solid #E2E8F0;background:#fff;white-space:nowrap;transition:background .15s,outline .15s}
.dtbl tr:last-child td{border-bottom:none}
.dtbl.clickable td{cursor:pointer}
.dtbl .empty{color:#CBD5E1;font-style:italic;font-size:12.5px}
.dtbl td.miss{background:#FEF3C7!important;outline:2px dashed #F59E0B;outline-offset:-2px}
.dtbl td.dup{background:#FCE7F3!important}
.dtbl td.bad{background:#FEE2E2!important}
.dtbl td.ok{background:#DCFCE7!important}
.dtbl td.fixed{background:#DBEAFE!important}
.dtbl td.sel{outline:3px solid #3B82F6!important;outline-offset:-3px}
.dtbl td.miss2{outline:3px dashed #EAB308!important;outline-offset:-3px}
.dtbl tr.sel td{background:#EEF2FF}
.dtbl tr.dup td{background:#FCE7F3}
.dtbl tr.ok td{background:#DCFCE7}
.dtbl tr.bad td{background:#FEE2E2}
.dtbl tr.removed td{opacity:.4;text-decoration:line-through}
.statcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin:10px 0}
.statcard{background:#fff;border:1.5px solid #E0E7FF;border-radius:14px;padding:10px 8px;text-align:center}
.statcard b{display:block;font-size:22px;color:#3730A3;line-height:1.2}
.statcard span{font-size:11.5px;color:#64748B;font-weight:700}
.notebook{background:#FFFDF5;border:1.5px dashed #FCD34D;border-radius:14px;padding:12px 16px;font-size:14.5px;line-height:1.7;color:#57534E;font-family:inherit}
.notebook .ln{margin:4px 0;padding:4px 6px;border-radius:8px}
.notebook .ln.used{background:#FEF9C3}
.slot{display:inline-flex;min-width:70px;min-height:30px;border:2px dashed #94A3B8;border-radius:9px;align-items:center;justify-content:center;padding:2px 8px;cursor:pointer;background:#F8FAFC;color:#94A3B8;font-size:12.5px;font-weight:700}
.slot.has{border-style:solid;border-color:#3B82F6;background:#EFF6FF;color:#172554}
.bank{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border:2px dashed #C7D2FE;border-radius:14px;background:#FAFAFF;min-height:50px}

/* kartu balik (dipakai di Ingat Kembali) */
.fc{perspective:900px;cursor:pointer;min-height:132px}
.fc-in{position:relative;height:100%;min-height:132px;transition:transform .55s;transform-style:preserve-3d}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid #BFDBFE}
.fc-f{background:linear-gradient(145deg,#fff,#EFF6FF);box-shadow:0 8px 22px rgba(37,99,235,.10)}
.fc-f .e{font-size:30px}.fc-f b{font-size:17px;margin-top:4px}.fc-f small{color:#64748B;font-size:12px;margin-top:2px}
.fc-b{background:linear-gradient(145deg,#F5F3FF,#FDF2F8);transform:rotateY(180deg);font-size:13.5px;line-height:1.45;color:#334155}
.fc-b b{color:#5B21B6;font-size:15px;margin-bottom:3px}
.fc.flipped .fc-f{visibility:hidden;transition:visibility 0s .25s}

/* tabel sederhana (kesimpulan/skor) */
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14.5px}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#64748B;text-align:left;padding:2px 10px}
.tbl td{background:#fff;border-top:1.5px solid #E0E7FF;border-bottom:1.5px solid #E0E7FF;padding:9px 10px}
.tbl td:first-child{border-left:1.5px solid #E0E7FF;border-radius:12px 0 0 12px;font-weight:800}
.tbl td:last-child{border-right:1.5px solid #E0E7FF;border-radius:0 12px 12px 0}
.tbl tr.sel td{background:#FEF3C7;border-color:#F59E0B}

@media(max-width:850px){
 .split,.split.even{grid-template-columns:minmax(0,1fr)}
 .split>*,.grid2>*,.panel,.infobox,.story,.qwrap{min-width:0}
 .grid3x{grid-template-columns:repeat(2,1fr)!important}
 .qopts{grid-template-columns:1fr}
 .badges{grid-template-columns:repeat(2,1fr)}
 .bars div{grid-template-columns:90px 1fr auto}
 .xp{font-size:12px;padding:4px 8px}
 .toast{bottom:84px}
 .split.tf{gap:12px}
 .split.tf>div:first-child{display:contents}
 .split.tf>div:first-child>.tabs{order:0}
 .statcards{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:851px){.split.tf>.panel{position:sticky;top:6px}}
.hero-tbl{max-width:280px}

/* peta konsep */
.cmt{max-width:1000px;margin:6px auto 0}
.cmt-root{width:max-content;margin:0 auto;padding:10px 26px;border-radius:18px;color:#fff;font-weight:900;font-size:22px;background:linear-gradient(135deg,#3B82F6,#8B5CF6);box-shadow:0 8px 22px rgba(99,102,241,.3);text-align:center;position:relative}
.cmt-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding-top:26px;position:relative}
.cmt-br{position:relative;border-radius:16px;padding:12px;border:2px solid var(--c);background:var(--p)}
.cmt-br:before{content:"";position:absolute;left:50%;top:-26px;width:3px;height:26px;background:var(--c);transform:translateX(-50%)}
.cmt-br:after{content:"";position:absolute;top:-26px;left:-8px;right:-8px;height:3px;background:var(--c)}
.cmt-br:first-child:after{left:50%}.cmt-br:last-child:after{right:50%}
.cmt-br h4{margin:0 0 8px;font-size:15px;color:var(--t)}
.cmt-root:after{content:"";position:absolute;left:50%;bottom:-26px;width:3px;height:26px;background:#8B5CF6;transform:translateX(-50%)}
.cmt-br .chips{gap:6px}.cmt-br .chip{padding:6px 10px;font-size:13px;border-color:var(--c)}
.cmt-br .chip.on{background:var(--c);color:#fff}
.cmt-info{margin-top:14px;background:#fff;border:2px solid #C7D2FE;border-radius:14px;padding:12px 16px;min-height:66px;font-size:15.5px;line-height:1.6}
.br-blue{--c:#3B82F6;--p:#F1F7FF;--t:#1E3A8A}.br-purple{--c:#8B5CF6;--p:#F5F3FF;--t:#4C1D95}.br-green{--c:#22C55E;--p:#F3FCF6;--t:#14532D}.br-pink{--c:#F472B6;--p:#FEF3F9;--t:#831843}
@media(max-width:850px){
 .cmt-row{grid-template-columns:1fr;padding-top:0;padding-left:20px;margin-left:12px;border-left:3px solid #8B5CF6;gap:12px}
 .cmt-root{margin-bottom:26px}
 .cmt-br:before{left:-20px;top:24px;width:20px;height:3px;transform:none}
 .cmt-br:after{display:none}
 .cmt-root:after{left:24px;bottom:-26px}
}

/* ================= PERTEMUAN 5 : Visualisasi ================= */
.vzwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.vz{display:block;width:100%;max-width:560px;margin:0 auto;height:auto;user-select:none}
.vz.clickable .vbar,.vz.clickable .vpt,.vz.clickable .vslice{cursor:pointer}
.vgrid{stroke:#E2E8F0;stroke-width:1}
.vaxisline{stroke:#94A3B8;stroke-width:1.5}
.vaxis{font-size:11px;fill:#94A3B8;font-weight:700}
.vcat{font-size:12px;fill:#475569;font-weight:800}
.vval{font-size:12px;fill:#172554;font-weight:900;transition:opacity .3s}
.vbar{transition:height .5s cubic-bezier(.2,.8,.3,1.1),y .5s cubic-bezier(.2,.8,.3,1.1),opacity .2s,filter .2s}
.vz.clickable .vbar:hover{filter:brightness(1.08)}
.vbar.sel{stroke:#172554;stroke-width:3}
.vbar.ok{fill:#22C55E!important}
.vbar.bad{fill:#EF4444!important}
.vbar.hl{filter:drop-shadow(0 0 0 transparent);stroke:#F59E0B;stroke-width:3}
.vbar.dim{opacity:.28}
.vline{stroke:#3B82F6;stroke-width:3}
.vpt{fill:#fff;stroke:#3B82F6;stroke-width:3;transition:r .2s,fill .2s}
.vz.clickable .vpt:hover{r:7}
.vpt.sel{stroke:#172554;r:7}
.vpt.ok{fill:#22C55E;stroke:#16A34A}
.vpt.bad{fill:#EF4444;stroke:#B91C1C}
.vpt.hl{stroke:#F59E0B;r:7}
.vslice{stroke:#fff;stroke-width:2;transition:opacity .2s,filter .2s,transform .2s;transform-origin:center}
.vz.clickable .vslice:hover{filter:brightness(1.06)}
.vslice.sel{stroke:#172554;stroke-width:3}
.vslice.ok{fill:#22C55E!important}
.vslice.bad{fill:#EF4444!important}
.vslice.dim{opacity:.35}
.vpct{font-size:12px;fill:#fff;font-weight:900;paint-order:stroke;stroke:rgba(0,0,0,.25);stroke-width:2px}
.pieBox{display:flex;justify-content:center}
.pieLeg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.pl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:99px;padding:5px 10px;cursor:pointer}
.pl i{width:11px;height:11px;border-radius:50%;display:inline-block}
.pl.ok{border-color:#22C55E;background:#F0FDF4}.pl.bad{border-color:#EF4444;background:#FEF2F2}.pl.sel{border-color:#3730A3}
.qviz{margin:10px 0}
.vizTabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.viz-mini{border:2px solid #E0E7FF;border-radius:14px;padding:10px;background:#fff;cursor:pointer;text-align:center;transition:.15s}
.viz-mini:hover{border-color:#93C5FD}
.viz-mini.on{border-color:#8B5CF6;background:linear-gradient(180deg,#F5F3FF,#fff);box-shadow:0 6px 16px rgba(139,92,246,.18)}
.viz-mini .e{font-size:26px}
.viz-mini b{display:block;font-size:13px;margin-top:2px}
.card-case{background:#fff;border:2px solid #C7D2FE;border-radius:16px;padding:16px;box-shadow:0 8px 22px rgba(37,99,235,.08)}
.gridpaper{background-image:linear-gradient(#EEF2FF 1px,transparent 1px),linear-gradient(90deg,#EEF2FF 1px,transparent 1px);background-size:100% 10%,10% 100%}
.buildbar{position:relative;height:230px;border:2px solid #C7D2FE;border-radius:12px;background:#fff;display:flex;align-items:flex-end;gap:0;padding:0 6px;overflow:hidden}
.buildcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:pointer}
.buildcol .track{width:60%;height:100%;position:relative;display:flex;align-items:flex-end}
.buildcol .fill{width:100%;border-radius:6px 6px 0 0;background:#CBD5E1;transition:height .18s}
.buildcol.ok .fill{background:#22C55E}
.buildcol .lab{position:absolute;bottom:-24px;font-size:11.5px;font-weight:800;color:#475569}
.buildcol .vv{position:absolute;top:-20px;font-size:12px;font-weight:900;color:#172554}
.stepnav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.stepnav span{padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:800;background:#F1F5F9;color:#64748B}
.stepnav span.on{background:linear-gradient(135deg,#3B82F6,#8B5CF6);color:#fff}
.stepnav span.done{background:#DCFCE7;color:#14532D}
.mp-field{margin:10px 0}
.mp-field label{display:block;font-size:13px;font-weight:800;color:#475569;margin-bottom:5px}
.mp-field textarea,.mp-field input[type=text]{width:100%;border:2px solid #C7D2FE;border-radius:12px;padding:10px 12px;font-size:14.5px;font-family:inherit;color:#172554}
.mp-field textarea{min-height:64px;resize:vertical}
.present-card{background:linear-gradient(135deg,#EFF6FF,#FDF4FF);border:2px solid #C7D2FE;border-radius:20px;padding:20px}
@media(max-width:360px){.cmt-root{font-size:16px;padding:8px 16px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">📈 Petualangan <span>Visual</span></div>
  <div class="progress-wrap"><div class="progress" id="progress"></div></div>
  <div class="xp" id="xp">⭐ 0 XP</div>
  <div class="counter" id="counter">1 / 20</div>
</header>

<aside class="sidebar" id="sidebar" aria-label="Daftar slide">
  <div class="sidebar-head">
    <div class="sidebar-title">Pertemuan 5 · Visualisasi Data</div>
    <button class="drawer-close" id="drawerClose" aria-label="Tutup menu">✕</button>
  </div>
  <div class="nav" id="nav"></div>
</aside>
<div class="scrim" id="scrim"></div>

<main class="stage">
  <div class="slide" id="slide"></div>
</main>

<footer class="footer">
  <div class="footer-left">
    <button class="btn sm toggle" id="toggleSidebar" aria-pressed="false" aria-label="Sembunyikan atau tampilkan menu samping"><span class="ti">☰</span> <span class="tl">Sembunyikan menu</span></button>
    <button class="btn sm toggle" id="toggleTop" aria-pressed="false" aria-label="Sembunyikan atau tampilkan bar atas"><span class="ti">⬆</span> <span class="tl">Sembunyikan bar atas</span></button>
    <div class="footer-info" id="footerInfo"></div>
  </div>
  <div class="controls">
    <button class="btn" id="prev">← Sebelumnya</button>
    <button class="btn primary" id="next">Berikutnya →</button>
  </div>
</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
/* ========== Utilitas ========== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let timers=[];
const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t};
const clearTimers=()=>{timers.forEach(clearTimeout);timers=[]};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const setEq=(a,b)=>a.size===b.size&&[...a].every(x=>b.has(x));
const slides=[];

/* ========== Skor, XP, notifikasi ========== */
const S={xp:0,done:{},best:{}};
function refreshXP(pop){const e=$('#xp');e.textContent='⭐ '+S.xp+' XP';if(pop){e.classList.add('pop');setTimeout(()=>e.classList.remove('pop'),260)}}

function award(key,xp,msg){if(S.done[key])return false;S.done[key]=true;S.xp+=xp;refreshXP(true);toast('⭐ +'+xp+' XP · '+msg);if(typeof renderNav==='function')renderNav();return true}

  api.markCell=(id,k,cls,on)=>{const key=id+'|'+k;cellMark[key]=cellMark[key]||new Set();on===false?cellMark[key].delete(cls):cellMark[key].add(cls);render()};
  api.clearCellMark=(...cs)=>{Object.keys(cellMark).forEach(k=>cs.forEach(c=>cellMark[k].delete(c)));render()};

  api.visRows=()=>sortedRows();

    const th=e.target.closest('th');

}

function wrapLabel(text,maxChars){
 const words=String(text).split(' ');if(words.length===1||text.length<=maxChars)return[text];
 const lines=[];let cur='';
 words.forEach(w=>{const t=cur?cur+' '+w:w;if(t.length>maxChars&&cur){lines.push(cur);cur=w}else cur=t});
 if(cur)lines.push(cur);

}
function BarChart(host,data,o){
 o=o||{};const W=o.W||460,H=o.H||300,padL=44,padT=18,padR=14;
 const wrap=document.createElement('div');wrap.className='vzwrap';host.appendChild(wrap);
 const n=data.length,approxBw=(W-padL-padR)/n;
 const maxChars=Math.max(4,Math.round(approxBw/6.2));
 const catLines=data.map(d=>wrapLabel(d.label,maxChars));
 const nLines=Math.max(...catLines.map(l=>l.length));
 const padB=30+nLines*13;
 const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'vz'+(o.clickable?' clickable':'')});wrap.appendChild(svg);
 const max=o.max||Math.max(...data.map(d=>d.value))*1.15||10;
 const innerW=W-padL-padR,innerH=H-padT-padB;
 const gap=innerW/n*0.28,bw=innerW/n-gap;
 const gY=svgEl('g',{},svg);
 const ticks=o.ticks||4;
 for(let i=0;i<=ticks;i++){const v=max/ticks*i,y=padT+innerH-innerH*(v/max);
  svgEl('line',{x1:padL,x2:W-padR,y1:y,y2:y,class:'vgrid'},gY);
  const t=svgEl('text',{x:padL-8,y:y+4,class:'vaxis','text-anchor':'end'},gY);t.textContent=Math.round(v);}
 const gBars=svgEl('g',{},svg);const bars=[];
 data.forEach((d,i)=>{
  const x=padL+i*(bw+gap)+gap/2,h0=0,h=innerH*(d.value/max);
  const bar=svgEl('rect',{x,y:padT+innerH,width:bw,height:0,rx:6,class:'vbar',fill:d.color||PALETTE[i%PALETTE.length],'data-i':i},gBars);
  const lbl=svgEl('text',{x:x+bw/2,y:H-padB+16,class:'vcat','text-anchor':'middle'},svg);
  catLines[i].forEach((ln,li)=>{const ts=svgEl('tspan',{x:x+bw/2,dy:li===0?0:12},lbl);ts.textContent=ln});
  const val=svgEl('text',{x:x+bw/2,y:padT+innerH-h-8,class:'vval','text-anchor':'middle',opacity:0},svg);val.textContent=fmtNum(d.value);
  bars.push({bar,val,x,w:bw,h,d,i});
 });
 svgEl('line',{x1:padL,x2:W-padR,y1:padT+innerH,y2:padT+innerH,class:'vaxisline'},svg);
 const grow=()=>bars.forEach((b,k)=>later(()=>{b.bar.setAttribute('y',padT+innerH-b.h);b.bar.setAttribute('height',b.h);b.val.setAttribute('opacity',1)},k*90));
 if(o.animate!==false)grow();else bars.forEach(b=>{b.bar.setAttribute('y',padT+innerH-b.h);b.bar.setAttribute('height',b.h);b.val.setAttribute('opacity',1)});
 const api={svg,wrap,bars,mark:(i,cls,on)=>{const b=bars[i];if(!b)return;b.bar.classList.toggle(cls,on!==false)},clearMarks:(...cs)=>bars.forEach(b=>cs.forEach(c=>b.bar.classList.remove(c)))};
 if(o.clickable)svg.addEventListener('click',e=>{const r=e.target.closest('.vbar');if(r&&api.onBar)api.onBar(+r.dataset.i)});

function LineChart(host,data,o){
 o=o||{};const W=o.W||460,H=o.H||300,padL=44,padB=40,padT=18,padR=20;
 const wrap=document.createElement('div');wrap.className='vzwrap';host.appendChild(wrap);

 });

/* ========== Diagram Lingkaran ========== */
function PieChart(host,data,o){
 o=o||{};const W=o.W||300,H=o.H||300,R=Math.min(W,H)/2-14,cx=W/2,cy=H/2;
 const wrap=document.createElement('div');wrap.className='vzwrap pie';host.appendChild(wrap);

 const total=data.reduce((a,d)=>a+d.value,0);
 let ang=-Math.PI/2;const slices=[];
 data.forEach((d,i)=>{
  const frac=d.value/total,a0=ang,a1=ang+frac*Math.PI*2;ang=a1;
  const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
  const large=(a1-a0)>Math.PI?1:0;
  const path=svgEl('path',{d:`M${cx} ${cy} L${x0} ${y0} A${R} ${R} 0 ${large} 1 ${x1} ${y1} Z`,class:'vslice',fill:d.color||PALETTE[i%PALETTE.length],'data-i':i},svg);
  if(o.animate!==false){path.style.opacity=0;later(()=>{path.style.transition='opacity .35s';path.style.opacity=1},i*100)}
  const mid=(a0+a1)/2,lx=cx+R*.68*Math.cos(mid),ly=cy+R*.68*Math.sin(mid);
  const lbl=svgEl('text',{x:lx,y:ly,class:'vpct','text-anchor':'middle'},svg);lbl.textContent=Math.round(frac*100)+'%';

 });
 const leg=document.createElement('div');leg.className='pieLeg';
 leg.innerHTML=data.map((d,i)=>`<div class="pl" data-i="${i}"><i style="background:${d.color||PALETTE[i%PALETTE.length]}"></i><b>${d.label}</b><span>${Math.round(d.value/total*100)}% (${d.value})</span></div>`).join('');
 wrap.appendChild(leg);
 const api={svg,wrap,slices,mark:(i,cls,on)=>{const s=slices[i];if(!s)return;s.path.classList.toggle(cls,on!==false);const l=leg.querySelector(`.pl[data-i="${i}"]`);if(l)l.classList.toggle(cls,on!==false)},clearMarks:(...cs)=>slices.forEach(s=>{cs.forEach(c=>s.path.classList.remove(c));const l=leg.querySelector(`.pl[data-i="${s.i}"]`);if(l)cs.forEach(c=>l.classList.remove(c))})};
 const pick=i=>api.onSlice&&api.onSlice(i);
 if(o.clickable){svg.addEventListener('click',e=>{const p=e.target.closest('.vslice');if(p)pick(+p.dataset.i)});
  leg.querySelectorAll('.pl').forEach(el=>el.addEventListener('click',()=>pick(+el.dataset.i)))}
 return api;
}

function runVizQuiz(box,list,o){

  if(q.k==='mcq'){
   $('#qBody').innerHTML='<div class="qopts">'+shuffle(q.opts.map((t,i)=>[t,i])).map(t=>`<button class="qopt" data-i="${t[1]}">${t[0]}</button>`).join('')+'</div>';

 {k:'mcq',topic:'Konsep',q:'Manakah yang <b>BUKAN</b> tujuan dari visualisasi data?',opts:['Membandingkan data','Melihat pola','Menyembunyikan data dari orang lain','Menyampaikan informasi lebih mudah'],a:2,ex:'Visualisasi justru bertujuan menyampaikan informasi dengan lebih jelas, bukan menyembunyikannya.'},
 {k:'mcq',topic:'Jenis Grafik',q:'Untuk membandingkan jumlah siswa di 5 ekstrakurikuler berbeda, sebaiknya memakai…',opts:['Diagram Batang','Diagram Garis','Tidak perlu visualisasi'],a:0,ex:'Membandingkan beberapa kategori paling cocok dengan <b>Diagram Batang</b>.'},
 {k:'mcq',topic:'Jenis Grafik',q:'Untuk melihat perubahan suhu tiap jam sepanjang hari, sebaiknya memakai…',opts:['Diagram Lingkaran','Diagram Garis','Tabel saja'],a:1,ex:'Perubahan dari waktu ke waktu paling cocok dengan <b>Diagram Garis</b>.'},
 {k:'mcq',topic:'Jenis Grafik',q:'Untuk melihat persentase jenis makanan favorit siswa, sebaiknya memakai…',opts:['Diagram Lingkaran','Diagram Garis','Diagram Batang'],a:0,ex:'Bagian dari keseluruhan (persentase) paling cocok dengan <b>Diagram Lingkaran</b>.'},
 {k:'pick',topic:'Membaca Grafik',viz:{type:'bar',data:EV_BAR,o:{W:420,H:250}},q:'Ketuk hari dengan jumlah <b>tertinggi</b> pada diagram berikut.',a:1,ex:'Selasa paling tinggi dengan nilai 18.',hint:'Cari batang tertinggi.'},
 {k:'num',topic:'Membaca Grafik',viz:{type:'bar',data:EV_BAR,o:{W:420,H:250}},q:'Berapa <b>selisih</b> antara Selasa dan Rabu?',a:9,tol:.5,ex:'18 − 9 = 9.',hint:'Kurangkan nilai Selasa dengan nilai Rabu.'},
 {k:'pick',topic:'Membaca Grafik',viz:{type:'line',data:EV_LINE,o:{W:420,H:250}},q:'Ketuk titik bulan dengan nilai <b>terendah</b>.',a:1,ex:'Februari paling rendah dengan nilai 20.',hint:'Cari titik yang paling rendah.'},
 {k:'mcq',topic:'Membaca Grafik',q:'Pada diagram lingkaran makanan favorit (Nasi Goreng 40%, Mie Ayam 35%, Bakso 25%), kesimpulan yang tepat adalah…',opts:['Nasi Goreng paling favorit, tapi Mie Ayam juga cukup diminati','Semua siswa suka Bakso','Tidak ada yang suka Nasi Goreng'],a:0,ex:'40% adalah yang terbesar, dan 35% pada Mie Ayam juga cukup besar — keduanya cukup diminati.'},
 {k:'mcq',topic:'Kesimpulan',q:'Kesimpulan yang baik dari sebuah grafik sebaiknya…',opts:['Ditulis sedramatis mungkin','Didukung oleh data yang terlihat pada grafik','Ditulis sebelum melihat grafiknya'],a:1,ex:'Kesimpulan yang baik harus didukung fakta yang terlihat pada grafik, bukan sekadar opini.'}];
slides.push({title:'Evaluasi: Kuis Visualisasi Data',short:'🎓 Kuis Visual',key:'quiz',
render:()=>`<div class="eyebrow">18 · Evaluasi</div><h2>🎓 Kuis Visualisasi Data</h2><p class="lead2">Soal berbasis <b>grafik dan kasus</b> — bukan sekadar hafalan istilah. Ada ${EV.length} soal.</p><div id="evBox"></div>`,
init:()=>{
 runVizQuiz($('#evBox'),EV,{tries:1,done:r=>{award('quiz',r.sum*3,'Kuis selesai ('+r.sum+'/'+r.tot+')');if(r.sum>=8){S.done.quizStar=true;renderNav();burst()}},next:()=>goTo(current+1),nextLabel:'Lihat rangkuman →'});
}});

/* ---------- 19. Rangkuman ---------- */
const CM=[
 ['blue','👁️ Konsep',[['Visualisasi Data','Penyajian data secara visual agar mudah dipahami.'],['Tujuan','Membandingkan, melihat perubahan/pola, menemukan tertinggi/terendah, menyampaikan informasi.']]],
 ['purple','🧩 Bentuk Visualisasi',[['Diagram Batang','Membandingkan kategori.'],['Diagram Garis','Melihat perubahan dari waktu ke waktu.'],['Diagram Lingkaran','Melihat bagian dari keseluruhan.'],['Tabel','Melihat data secara rinci.']]],
 ['green','👓 Membaca Grafik',[['Tertinggi/Terendah','Membandingkan tinggi batang/titik/persentase.'],['Selisih','Mengurangkan dua nilai.'],['Pola','Kecenderungan naik/turun/merata.']]],
 ['pink','🎯 Praktik',[['Pilih Grafik','Memasangkan kasus dengan jenis grafik.'],['Buat Grafik','Menggambar diagram batang dari data.'],['Mini Project','Data → Visualisasi → Informasi → Kesimpulan → Presentasi.']]]];
slides.push({title:'Rangkuman: Peta Konsep Visualisasi Data',short:'🗺️ Rangkuman',key:'map',
render:()=>`
<div class="eyebrow">19 · Rangkuman</div>
<h2>🗺️ Peta Konsep Visualisasi Data</h2>
<p class="lead2">Ketuk tiap istilah untuk mengingat artinya.</p>
<div class="cmt"><div class="cmt-root">📈 VISUALISASI DATA</div>
 <div class="cmt-row">${CM.map((b,bi)=>`<div class="cmt-br br-${b[0]}"><h4>${b[1]}</h4><div class="chips">${b[2].map((c,ci)=>`<button class="chip" data-b="${bi}" data-c="${ci}">${c[0]}</button>`).join('')}</div></div>`).join('')}</div>
 <div class="cmt-info" id="cmInfo">👆 Ketuk salah satu istilah di atas.</div>
</div>
<div class="highlight" style="margin-top:14px">🧭 <b>Alur lengkap analisis data:</b> Data → Tujuan → Kumpulkan → Bersihkan → Eksplorasi → Visualisasikan → Kesimpulan. Selamat, kamu sudah menuntaskan seluruh alurnya! 🎉</div>`,
init:()=>{
 const seen=new Set();const total=CM.reduce((a,b)=>a+b[2].length,0);
 $$('.cmt .chip').forEach(c=>c.onclick=()=>{$$('.cmt .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
  const t=CM[+c.dataset.b][2][+c.dataset.c];$('#cmInfo').innerHTML=`<b>${t[0]}</b> — ${t[1]}`;seen.add(c.dataset.b+'-'+c.dataset.c);if(seen.size===total)award('map',5,'Peta konsep dijelajahi')});
}});

/* ---------- 20. Penutup ---------- */
const BADGES=[['kartu','kartu','🃏','Pemasang Kartu','Pilih Grafik'],['buat','buat','✏️','Perancang Grafik','Buat Grafik'],['mp4','mp4','🎤','Presenter Data','Mini Project'],['pilih','pilih','🧭','Pemilih Tepat','Memilih Visualisasi'],['baca1','baca1','👓','Pembaca Grafik','Membaca Diagram Batang'],['quizStar','quiz','🎓','Bintang Kuis','Kuis: 8+ benar']];
const CHECK=['Menjelaskan apa itu visualisasi data','Menyebutkan tujuan visualisasi data','Mengenal 4 bentuk visualisasi (batang, garis, lingkaran, tabel)','Memilih visualisasi yang tepat untuk suatu kasus','Membaca grafik (tertinggi, terendah, selisih, pola)','Menarik kesimpulan dari sebuah grafik','Membuat grafik sederhana dari data','Menuntaskan mini project dari topik sampai presentasi'];
slides.push({title:'Selesai: Lencana dan Refleksi',short:'🏆 Selesai',
render:()=>{
 const got=BADGES.filter(b=>S.done[b[0]]).length;
 const lv=S.xp>=160?['🏆','Master Visualisasi Data']:S.xp>=100?['📈','Perancang Grafik']:S.xp>=50?['📊','Pembaca Grafik']:['🌱','Pemula Visual'];
 return `
<div class="center"><div class="eyebrow">20 · Penutup</div><div style="font-size:64px">${lv[0]}</div><h2 style="margin-bottom:4px">Petualangan Visualisasi Data Selesai!</h2>
<p class="lead2" style="margin:0">Levelmu: <b>${lv[1]}</b> · <b>⭐ ${S.xp} XP</b> · Lencana: <b>${got} / ${BADGES.length}</b></p>
<div class="tline" style="justify-content:center"><span>Pertemuan 1-3 · Struktur Data ✓</span><span>Pertemuan 4 · Analisis Data ✓</span><span class="cur">Pertemuan 5 · Visualisasi Data ✓</span></div></div>
<div class="badges">${BADGES.map(b=>`<div class="bdg ${S.done[b[0]]?'got':''}" data-go="${b[1]}"><div class="e">${b[2]}</div><b>${b[3]}</b><small>${S.done[b[0]]?'Diperoleh ✓':b[4]+' — ketuk untuk menuju ke sana'}</small></div>`).join('')}</div>
<div class="grid2" style="align-items:start"><div><h3>✅ Aku sudah bisa…</h3><div id="chk">${CHECK.map((c,i)=>`<div class="check" data-i="${i}"><i>✓</i><span>${c}</span></div>`).join('')}</div></div>
<div><h3>💬 Refleksi singkat</h3><div class="highlight" style="margin-top:6px">Tuliskan di buku catatanmu:<br>1) Grafik apa yang paling sering kamu temui sehari-hari?<br>2) Apa jenisnya (batang/garis/lingkaran/tabel)?<br>3) Informasi apa yang bisa kamu ambil darinya?</div>
<div class="row mt"><button class="btn" id="goStart">↺ Kembali ke awal</button><button class="btn primary" id="goQuiz">🎓 Coba Kuis Lagi</button></div></div></div>`},
init:()=>{
 $$('.bdg').forEach(b=>b.onclick=()=>{const i=slides.findIndex(s=>s.key===b.dataset.go);if(i>=0)goTo(i)});
 $$('.check').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
 $('#goStart').onclick=()=>goTo(0);$('#goQuiz').onclick=()=>goTo(slides.findIndex(s=>s.key==='quiz'));
 if(BADGES.filter(b=>S.done[b[0]]).length>=4)burst();
}});

/* ========== Mesin slide, menu geser, tombol buka/tutup ========== */
let current=0;
const nav=$('#nav'),slideEl=$('#slide'),progress=$('#progress'),counter=$('#counter'),prevB=$('#prev'),nextB=$('#next'),footerInfo=$('#footerInfo'),app=$('.app');
function bindToggle(btn,cls,hideLabel,showLabel,hideIcon,showIcon){
 const lab=btn.querySelector('.tl'),ico=btn.querySelector('.ti');
 btn.onclick=()=>{const hidden=app.classList.toggle(cls);btn.setAttribute('aria-pressed',String(hidden));lab.textContent=hidden?showLabel:hideLabel;ico.textContent=hidden?showIcon:hideIcon};
}
const sideBtn=$('#toggleSidebar');
bindToggle(sideBtn,'no-sidebar','Sembunyikan menu','Tampilkan menu','☰','☰');
const isPhone=window.matchMedia('(max-width:850px)');
const desktopSideClick=sideBtn.onclick;
function setDrawer(open){app.classList.toggle('drawer-open',open);sideBtn.setAttribute('aria-expanded',String(open));if(open){const a=$('#nav .active');if(a)a.scrollIntoView({block:'center'})}}
sideBtn.onclick=e=>{isPhone.matches?setDrawer(!app.classList.contains('drawer-open')):desktopSideClick(e)};
$('#scrim').onclick=()=>setDrawer(false);
$('#drawerClose').onclick=()=>setDrawer(false);
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){setDrawer(false);return}
 if(e.target.closest&&e.target.closest('input,textarea,select'))return;
 if(e.key==='ArrowRight'&&!nextB.disabled)goTo(current+1);
 if(e.key==='ArrowLeft'&&!prevB.disabled)goTo(current-1);
});
(isPhone.addEventListener?isPhone.addEventListener('change',()=>setDrawer(false)):isPhone.addListener(()=>setDrawer(false)));
bindToggle($('#toggleTop'),'no-top','Sembunyikan bar atas','Tampilkan bar atas','⬆','⬇');

function renderNav(){
 nav.innerHTML=slides.map((s,i)=>`<button class="${i===current?'active':''}${s.key&&S.done[s.key]?' done':''}" data-go="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${s.short}</span></button>`).join('');
 $$('[data-go]',nav).forEach(b=>b.onclick=()=>{goTo(Number(b.dataset.go));setDrawer(false)});
}
function render(){
 clearTimers();
 const s=slides[current];
 slideEl.innerHTML='<div class="slide-inner">'+s.render()+'</div>';
 progress.style.width=((current+1)/slides.length*100)+'%';
 counter.textContent=(current+1)+' / '+slides.length;
 footerInfo.textContent=s.title;
 prevB.disabled=current===0;
 nextB.disabled=current===slides.length-1;
 nextB.textContent=current===slides.length-1?'Selesai':'Berikutnya →';
 renderNav();
 slideEl.scrollTop=0;
 if(s.init)s.init();
}
function goTo(i){if(i<0||i>=slides.length)return;current=i;render()}
prevB.onclick=()=>goTo(current-1);
nextB.onclick=()=>goTo(current+1);
refreshXP(false);
render();

})();
</script>
</body>
</html>
