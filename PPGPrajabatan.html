        let activeState = { semId: "sem1", modId: "m1", topicId: "t1-1" };

        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar();
            loadTopic(activeState.semId, activeState.modId, activeState.topicId);
            lucide.createIcons();
        });

        function switchView(mode) {
            const btnReader = document.getElementById("btnReader");
            const btnMap = document.getElementById("btnMap");
            const reader = document.getElementById("readerContainer");
            const map = document.getElementById("mapContainer");

            if(mode === 'reader') {
                btnReader.className = "px-3.5 py-1.5 text-xs font-semibold rounded-lg transition flex items-center gap-2 bg-blue-600 text-white shadow-sm";
                btnMap.className = "px-3.5 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition flex items-center gap-2";
                reader.classList.remove("hidden");
                map.classList.add("hidden");
            } else {
                btnMap.className = "px-3.5 py-1.5 text-xs font-semibold rounded-lg transition flex items-center gap-2 bg-blue-600 text-white shadow-sm";
                btnReader.className = "px-3.5 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition flex items-center gap-2";
                map.classList.remove("hidden");
                reader.classList.add("hidden");
                renderCanvasMap();
            }
        }

        function renderSidebar() {
            const menu = document.getElementById("sidebarMenu");
            menu.innerHTML = "";

            ppgData.semesters.forEach(sem => {
                const semBox = document.createElement("div");
                semBox.className = "space-y-1.5";
                
                const semHead = document.createElement("div");
                semHead.className = "px-2 py-1 text-[11px] font-bold text-slate-400 uppercase tracking-wider flex justify-between items-center";
                semHead.innerHTML = `<span>${sem.title}</span><span class="text-blue-400 font-mono">${sem.sks} SKS</span>`;
                semBox.appendChild(semHead);

                sem.modules.forEach(mod => {
                    const modBox = document.createElement("div");
                    modBox.className = "rounded-xl border border-slate-800/80 bg-slate-950/40 overflow-hidden";
                    
                    const modTitle = document.createElement("div");
                    modTitle.className = "px-3 py-2 bg-slate-900/80 text-xs font-bold text-slate-200 border-b border-slate-800/60 flex items-center justify-between";
                    modTitle.innerHTML = `<span class="truncate">${mod.code}: ${mod.title}</span>`;
                    modBox.appendChild(modTitle);

                    const topicList = document.createElement("div");
                    topicList.className = "p-1.5 space-y-0.5";

                    mod.topics.forEach(t => {
                        const isAct = (t.id === activeState.topicId);
                        const tBtn = document.createElement("button");
                        tBtn.className = `w-full text-left px-2.5 py-1.5 rounded-lg text-xs transition flex items-center gap-2 ${isAct ? 'bg-blue-600/20 text-blue-400 font-semibold border border-blue-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/60'}`;
                        tBtn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${isAct ? 'bg-blue-400' : 'bg-slate-700'} shrink-0"></span><span class="truncate">${t.title}</span>`;
                        tBtn.onclick = () => {
                            activeState = { semId: sem.id, modId: mod.id, topicId: t.id };
                            renderSidebar();
                            loadTopic(sem.id, mod.id, t.id);
                        };
                        topicList.appendChild(tBtn);
                    });

                    modBox.appendChild(topicList);
                    semBox.appendChild(modBox);
                });

                menu.appendChild(semBox);
            });
        }

        function loadTopic(semId, modId, topicId) {
            const sem = ppgData.semesters.find(s => s.id === semId);
            const mod = sem.modules.find(m => m.id === modId);
            const topic = mod.topics.find(t => t.id === topicId);

            document.getElementById("topicHeader").innerHTML = `
                <div class="flex items-center gap-2 text-xs font-mono text-blue-400 mb-1.5">
                    <span class="bg-blue-950 border border-blue-800 px-2 py-0.5 rounded-md">${sem.title}</span>
                    <span>&bull;</span>
                    <span>${mod.code}</span>
                </div>
                <h2 class="text-xl font-bold text-slate-100">${mod.title}</h2>
                <p class="text-xs text-slate-400 mt-1">${mod.desc}</p>
            `;

            document.getElementById("articleBody").innerHTML = topic.content;
        }

                <path d="M 230 204 L 135 260" stroke="#334155" stroke-width="2" />
                <path d="M 230 204 L 325 260" stroke="#334155" stroke-width="2" />
                <path d="M 135 298 L 135 350" stroke="#334155" stroke-width="2" />
                <path d="M 325 298 L 325 350" stroke="#334155" stroke-width="2" />
            `;
        }

        function handleSearch(query) {
            if (!query.trim()) return;
            const body = document.getElementById("articleBody");
            if (!body) return;

            const text = body.innerHTML;
            const re = new RegExp(`(${query})`, "gi");
            body.innerHTML = text.replace(/<span class="highlight">(.*?)<\/span>/gi, "$1").replace(re, '<span class="highlight">$1</span>');
        }
    </script>
