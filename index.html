<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petualangan Struktur Data — Fondasi Struktur Data</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#F0F7FF;
  --panel:#FFFFFF;
  --panel2:#EFF6FF;
  --text:#172554;
  --muted:#64748B;
  --accent:#3B82F6;
  --accent2:#8B5CF6;
  --gold:#FBBF24;
  --danger:#F472B6;
  --success:#22C55E;
  --pink:#F472B6;
  --purple:#8B5CF6;
  --border:rgba(37,99,235,.14);
  --shadow:0 18px 50px rgba(37,99,235,.12)
}
html,body{margin:0;width:100%;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#F0F7FF 0%,#FDFBFF 52%,#FFF7FC 100%);color:var(--text);overflow:hidden}
button{font:inherit}
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:270px 1fr;grid-template-rows:64px 1fr 70px}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 22px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);box-shadow:0 4px 18px rgba(37,99,235,.07);z-index:5}
.brand{font-weight:800;white-space:nowrap}.brand span{color:var(--accent2)}
.progress-wrap{flex:1;height:8px;background:#DBEAFE;border-radius:99px;overflow:hidden}
.progress{height:100%;width:6.25%;background:linear-gradient(90deg,#3B82F6,#8B5CF6,#F472B6);border-radius:99px;transition:.3s}
.counter{font-size:13px;color:var(--muted);white-space:nowrap}
.sidebar{background:rgba(255,255,255,.92);border-right:1px solid var(--border);box-shadow:4px 0 18px rgba(37,99,235,.06);padding:18px 12px;overflow:auto}
.sidebar-title{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);padding:0 10px 12px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{border:1px solid transparent;background:transparent;color:#475569;text-align:left;padding:10px 11px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px}
.nav button:hover{background:#EFF6FF;color:#172554}
.nav button.active{background:linear-gradient(90deg,#DBEAFE,#F3E8FF);border-color:rgba(139,92,246,.24);color:#172554}
.num{width:25px;height:25px;border-radius:8px;background:#E0E7FF;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.nav button.active .num{background:linear-gradient(135deg,#3B82F6,#8B5CF6);color:#FFFFFF}
.stage{position:relative;min-width:0;min-height:0;padding:24px;background:
 radial-gradient(circle at 85% 10%,rgba(59,130,246,.16),transparent 30%),
 radial-gradient(circle at 15% 90%,rgba(244,114,182,.12),transparent 28%),
 radial-gradient(circle at 55% 95%,rgba(139,92,246,.08),transparent 25%)}
.slide{height:100%;width:100%;max-width:1180px;margin:auto;background:linear-gradient(145deg,#FFFFFF,#F8FBFF);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);overflow:auto}
.slide-inner{min-height:100%;padding:46px 56px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{color:var(--accent);font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
h1{font-size:clamp(34px,5vw,64px);line-height:1.03;margin:0 0 18px;letter-spacing:-2px}
h2{font-size:clamp(28px,4vw,44px);margin:0 0 18px;letter-spacing:-1px}
h3{margin:0 0 8px;font-size:19px}
p{font-size:17px;line-height:1.7;color:#475569;margin:8px 0}
.lead{font-size:20px;max-width:800px;color:#475569}
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:35px;align-items:center}
.hero-art{min-height:330px;border-radius:24px;background:linear-gradient(145deg,#DBEAFE,#F3E8FF 52%,#FCE7F3);border:1px solid var(--border);box-shadow:inset 0 0 40px rgba(255,255,255,.55);display:grid;place-items:center;position:relative;overflow:hidden}
.hero-art:before,.hero-art:after{content:"";position:absolute;border-radius:50%;filter:blur(2px)}
.hero-art:before{width:190px;height:190px;background:rgba(59,130,246,.18);top:-60px;right:-40px}
.hero-art:after{width:160px;height:160px;background:rgba(244,114,182,.18);bottom:-50px;left:-30px}
.tree-art{position:relative;width:270px;height:230px}
.dot{position:absolute;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#FFFFFF;border:3px solid var(--accent);color:#172554;box-shadow:0 8px 18px rgba(59,130,246,.16);font-weight:800;z-index:2}
.line{position:absolute;height:3px;background:#93C5FD;transform-origin:left center;z-index:1}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.card{background:#FFFFFF;border:1px solid var(--border);box-shadow:0 8px 24px rgba(37,99,235,.08);border-radius:16px;padding:20px}
.card .icon{font-size:28px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.list{padding-left:20px;color:#475569;line-height:1.9;font-size:16px}
.highlight{border-left:4px solid var(--accent);background:#ECFDF5;padding:15px 18px;border-radius:0 12px 12px 0;margin:15px 0}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#EEF6FF;border:1px solid #BFDBFE;padding:18px;border-radius:14px;color:#1D4ED8;box-shadow:inset 0 2px 8px rgba(59,130,246,.04);font-size:18px}
.center{text-align:center}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:99px;background:#F3E8FF;color:#5B21B6;border:1px solid #DDD6FE;font-size:12px;margin:3px}
.term{color:var(--accent);font-weight:800}
.footer{grid-column:1/-1;background:rgba(255,255,255,.96);border-top:1px solid var(--border);box-shadow:0 -4px 18px rgba(37,99,235,.06);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:5}
.footer-info{font-size:13px;color:var(--muted)}
.controls{display:flex;gap:9px}
.btn{border:1px solid var(--border);background:#FFFFFF;color:#172554;border-color:#BFDBFE;padding:11px 17px;border-radius:11px;cursor:pointer;font-weight:700}
.btn:hover{background:#DBEAFE}
.btn.primary{background:linear-gradient(135deg,#3B82F6,#8B5CF6);color:#FFFFFF;border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.quiz-box{background:#FFFFFF;border:1px solid #BFDBFE;box-shadow:0 10px 28px rgba(37,99,235,.08);border-radius:18px;padding:24px;margin-top:16px}
.question{font-size:20px;font-weight:750;line-height:1.45;margin-bottom:16px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option{padding:14px;border:1px solid #2a3854;background:#F8FAFC;color:#172554;border-color:#CBD5E1;border-radius:12px;text-align:left;cursor:pointer}
.option:hover{border-color:#60A5FA}
.data-card{cursor:grab}
.data-card:active{cursor:grabbing}
.drop-zone{transition:.2s;border:2px dashed #93C5FD}
.drop-zone.over{border-color:#3B82F6;background:#EFF6FF;transform:translateY(-2px)}
.drop-items .data-card{padding:7px 10px;font-size:12px;cursor:default}
.activity-note{font-size:13px;color:var(--muted)}

.option.correct{border-color:#3B82F6;background:rgba(59,130,246,.18)}
.option.wrong{border-color:var(--danger);background:rgba(251,113,133,.10)}
.feedback{min-height:25px;margin-top:14px;font-weight:700}
.array{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0}
.array-item{width:72px;height:72px;background:#FFFFFF;border:2px solid #BFDBFE;box-shadow:0 6px 16px rgba(37,99,235,.08);border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.array-item .idx{font-size:10px;color:var(--muted)}.array-item .val{font-weight:800;font-size:20px}
.node-board{position:relative;height:290px;border-radius:18px;background:linear-gradient(135deg,#EFF6FF,#FDF4FF);border:1px solid #BFDBFE;margin-top:18px;overflow:hidden}
.node{position:absolute;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#FFFFFF;border:3px solid #8B5CF6;color:#312E81;box-shadow:0 7px 18px rgba(139,92,246,.15);font-weight:800;cursor:pointer;user-select:none}
.node.selected{border-color:var(--gold);box-shadow:0 0 0 5px rgba(251,191,36,.18),0 8px 20px rgba(251,191,36,.18)}
.node.connected{border-color:#3B82F6}
.svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.edge{stroke:#94A3B8;stroke-width:3}
.mode{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
.result{font-size:25px;font-weight:850;color:var(--accent);margin-top:12px}
.big-check{font-size:80px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:center}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:11px;border-bottom:1px solid var(--border);text-align:left;color:#475569}
th{color:var(--accent)}
@media(max-width:850px){
 .app{grid-template-columns:1fr;grid-template-rows:58px 1fr 66px}
 .sidebar{display:none}.topbar{padding:0 13px}.brand{font-size:13px}
 .stage{padding:10px}.slide{border-radius:16px}.slide-inner{padding:28px 22px}
 .hero,.two-col,.grid2{grid-template-columns:1fr}.cards,.grid3{grid-template-columns:1fr}
 .options{grid-template-columns:1fr}.footer{padding:0 12px}.footer-info{display:none}
}

/* Fun Learning visual layer */
.slide-inner > .eyebrow{
  display:inline-flex;
  width:max-content;
  padding:7px 12px;
  border-radius:999px;
  background:linear-gradient(90deg,#DBEAFE,#F3E8FF);
  color:#4C1D95;
  box-shadow:0 4px 12px rgba(139,92,246,.08);
}
.card{
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 28px rgba(37,99,235,.12);
  border-color:#93C5FD;
}
.btn{
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
}
.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(37,99,235,.12);
}
.btn.primary{
  background:linear-gradient(135deg,#3B82F6,#8B5CF6);
  box-shadow:0 7px 18px rgba(59,130,246,.22);
}
.highlight{
  border-left:5px solid #FBBF24;
  background:linear-gradient(90deg,#FFFBEB,#FFF7ED);
  box-shadow:0 6px 18px rgba(251,191,36,.08);
}
.question{color:#172554}
.result{color:#16A34A}
.term{color:#7C3AED}

/* Peta konsep (slide Rangkuman) */
.cm-wrap{overflow-x:auto;margin:4px -6px 0;padding:0 6px}
.cm-svg{display:block;width:100%;min-width:760px;height:auto}
.cm-node{opacity:0;transform:translateY(8px);animation:cmIn .5s ease forwards;animation-delay:var(--d,0s)}
.cm-line{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1;animation:cmDraw .6s ease forwards;animation-delay:var(--d,0s)}
@keyframes cmIn{to{opacity:1;transform:none}}
@keyframes cmDraw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.cm-node{animation:none;opacity:1;transform:none}.cm-line{animation:none;stroke-dashoffset:0}}

/* Buka/tutup menu samping & bar atas */
.sidebar{grid-column:1;grid-row:2;min-width:0;transition:opacity .2s ease}
.stage{grid-column:2;grid-row:2}
.topbar{grid-row:1;min-height:0;overflow:hidden;transition:opacity .2s ease}
.footer{grid-row:3}
.app{transition:grid-template-columns .28s ease,grid-template-rows .28s ease}
.app.no-sidebar{grid-template-columns:0px 1fr}
.app.no-top{grid-template-rows:0px 1fr 70px}
.app.no-sidebar .sidebar{opacity:0;visibility:hidden;padding-left:0;padding-right:0;border-right-width:0;box-shadow:none;overflow:hidden;transition:opacity .15s ease,visibility 0s linear .28s}
.app.no-top .topbar{opacity:0;visibility:hidden;border-bottom-width:0;box-shadow:none;transition:opacity .15s ease,visibility 0s linear .28s}
.footer-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.footer-info{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:6px}
.btn.sm{padding:8px 12px;font-size:13px;white-space:nowrap;flex:none}
.btn.toggle[aria-pressed="true"]{background:#EDE9FE;border-color:#C4B5FD;color:#4C1D95}
.btn:focus-visible{outline:3px solid #93C5FD;outline-offset:2px}
@media(max-width:850px){
 .stage{grid-column:1}
 .app.no-sidebar{grid-template-columns:1fr}
 .app.no-top{grid-template-rows:0px 1fr 66px}
 #toggleSidebar{display:none}
 .toggle .tl{display:none}
 .btn.sm{padding:9px 12px}
}

/* ===== Tampilan HP: menu geser (drawer), peta konsep vertikal, perbaikan layout ===== */
.sidebar-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.drawer-close{display:none;flex:none;width:40px;height:40px;margin:-6px -4px 0 0;border:1px solid #BFDBFE;background:#fff;color:#172554;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;place-items:center}
.scrim{display:none}
.cmm{display:none}
.cmm{max-width:560px;margin:8px auto 0}
.cmm-root{border-radius:18px;padding:10px 14px;text-align:center;color:#fff;font-weight:800;font-size:20px;line-height:1.15;background:linear-gradient(135deg,#3B82F6,#8B5CF6);box-shadow:0 6px 18px rgba(59,130,246,.22)}
.cmm-root small{display:block;font-size:12px;font-weight:500;opacity:.92}
.cmm-kids{margin-left:20px;padding:14px 0 0 14px}
.cmm-branch{position:relative;--c:#3B82F6;--f:#DBEAFE;--p:#F1F7FF;--t:#1E3A8A}
.cmm-branch+.cmm-branch{margin-top:14px}
.cmm-branch:before{content:"";position:absolute;left:-14px;top:51px;width:14px;height:3px;border-radius:3px;background:var(--c)}
.cmm-branch:after{content:"";position:absolute;left:-14px;top:-14px;width:3px;height:calc(100% + 14px);border-radius:3px;background:var(--c)}
.cmm-branch:last-child:after{height:65px}
.b-blue{--c:#3B82F6;--f:#DBEAFE;--p:#F1F7FF;--t:#1E3A8A}
.b-purple{--c:#8B5CF6;--f:#EDE9FE;--p:#F5F3FF;--t:#4C1D95}
.b-green{--c:#22C55E;--f:#DCFCE7;--p:#F3FCF6;--t:#14532D}
.b-pink{--c:#F472B6;--f:#FCE7F3;--p:#FEF3F9;--t:#831843}
.cmm-link{display:block;width:max-content;max-width:100%;height:20px;line-height:17px;margin-bottom:5px;padding:0 10px;border-radius:999px;background:#fff;border:1.3px solid var(--c);color:var(--t);font-size:11.5px;font-weight:700}
.cmm-head{min-height:52px;box-sizing:border-box;padding:6px 12px;border-radius:16px;background:var(--f);border:2px solid var(--c);color:var(--t);display:flex;flex-direction:column;justify-content:center;font-weight:800;font-size:16px;line-height:1.2;box-shadow:0 4px 12px rgba(37,99,235,.10)}
.cmm-head small{font-size:12px;font-weight:500;color:#475569}
.cmm-panel{margin-top:8px;padding:10px;border-radius:16px;border:1.5px dashed var(--c);background:var(--p);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmm-chip{background:#fff;border:1.5px solid var(--c);border-radius:12px;padding:8px 6px;text-align:center;color:var(--t);font-weight:800;font-size:13.5px;line-height:1.2;display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(37,99,235,.10)}
.cmm-chip small{display:block;margin-top:2px;font-size:11.5px;font-weight:500;color:#64748B}
.cmm-chip.wide{grid-column:1/-1}
.cm-slide{margin:-20px 0}

@media(max-width:850px){
 /* menu geser */
 .sidebar{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);z-index:40;padding:14px 12px;background:#fff;overflow-y:auto;overscroll-behavior:contain;transform:translateX(-102%);visibility:hidden;box-shadow:none;transition:transform .28s ease,visibility 0s linear .28s}
 .app.no-sidebar .sidebar{opacity:1;padding-left:12px;padding-right:12px;border-right-width:1px}
 .app.drawer-open .sidebar{transform:none;visibility:visible;box-shadow:8px 0 40px rgba(15,23,42,.28);transition:transform .28s ease,visibility 0s}
 .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:opacity .25s ease}
 .app.drawer-open .scrim{opacity:1;pointer-events:auto}
 .drawer-close{display:grid}
 .nav button{padding:13px 12px;font-size:15px;gap:12px}
 .num{width:28px;height:28px}
 /* tombol footer: ikon saja, mudah disentuh */
 #toggleSidebar{display:inline-flex}
 .btn.sm{min-width:44px;min-height:44px;padding:0 12px;align-items:center;justify-content:center;font-size:16px}
 .footer .controls{gap:6px}
 .footer .controls .btn{min-height:44px;padding:0 11px;font-size:13.5px;white-space:nowrap}
 .footer-left{flex:none}
 /* peta konsep: versi vertikal */
 .cm-wrap{display:none}
 .cmm{display:block}
 .cm-slide{margin:0}
 /* label kecil tidak keluar dari kartu */
 .slide-inner > .eyebrow{width:fit-content;max-width:100%;line-height:1.35;white-space:normal}
 /* game hubungkan node: posisi node muat di layar sempit */
 #nodeGame .node[data-node="A"]{left:5%!important;top:40%!important}
 #nodeGame .node[data-node="B"]{left:30%!important;top:8%!important}
 #nodeGame .node[data-node="C"]{left:56%!important;top:40%!important}
 #nodeGame .node[data-node="D"]{left:calc(95% - 62px)!important;top:66%!important}
 .app{grid-template-rows:58px 1fr 66px}
 .app.no-top{grid-template-rows:0px 1fr 66px}
}
/* HP kecil (<= 380px) */
@media(max-width:380px){
 .btn.sm{min-width:40px}
 .footer{padding:0 8px}
 .footer-left{gap:6px}
 .footer .controls{gap:5px}
 .footer .controls .btn{padding:0 8px;font-size:12.5px}
}
@media(max-width:380px){.topbar{gap:10px}.brand{font-size:12px}.progress-wrap{min-width:36px}}
@media(max-width:340px){#toggleTop{display:none}}
/* HP mode landscape (layar pendek) */
@media(max-width:850px) and (max-height:480px){
 .app{grid-template-rows:44px 1fr 56px}
 .app.no-top{grid-template-rows:0px 1fr 56px}
 .stage{padding:6px}
 .slide-inner{padding:18px 22px}
 .btn.sm{min-height:40px}.footer .controls .btn{min-height:40px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">🚀 Petualangan <span>Struktur Data</span></div>
  <div class="progress-wrap"><div class="progress" id="progress"></div></div>
  <div class="counter" id="counter">1 / 16</div>
</header>

<aside class="sidebar" id="sidebar" aria-label="Daftar slide">
  <div class="sidebar-head">
    <div class="sidebar-title">Pertemuan 1 · Fondasi</div>
    <button class="drawer-close" id="drawerClose" aria-label="Tutup menu">✕</button>
  </div>
  <div class="nav" id="nav"></div>
</aside>
<div class="scrim" id="scrim"></div>

<main class="stage">
  <div class="slide" id="slide"></div>
</main>

<footer class="footer">
  <div class="footer-left">
    <button class="btn sm toggle" id="toggleSidebar" aria-pressed="false" aria-label="Sembunyikan atau tampilkan menu samping"><span class="ti">☰</span> <span class="tl">Sembunyikan menu</span></button>
    <button class="btn sm toggle" id="toggleTop" aria-pressed="false" aria-label="Sembunyikan atau tampilkan bar atas"><span class="ti">⬆</span> <span class="tl">Sembunyikan bar atas</span></button>
    <div class="footer-info" id="footerInfo">Gunakan menu atau tombol untuk berpindah slide.</div>
  </div>
  <div class="controls">
    <button class="btn" id="prev">← Sebelumnya</button>
    <button class="btn primary" id="next">Berikutnya →</button>
  </div>
</footer>
</div>

<script>
(function(){
"use strict";

function conceptMapMobile(){
  const chip=(icon,name,sub,wide)=>`<div class="cmm-chip${wide?" wide":""}"><span>${icon} ${name}</span><small>${sub}</small></div>`;
  const panel=items=>`<div class="cmm-panel">${items.map(i=>chip(i[0],i[1],i[2],i[3])).join("")}</div>`;
  const branch=(cls,link,icon,title,sub,inner,d)=>`<div class="cmm-branch ${cls} cm-node" style="--d:${d}s"><span class="cmm-link">${link}</span><div class="cmm-head"><span>${icon} ${title}</span><small>${sub}</small></div>${inner}</div>`;
  const jenis=panel([["🔤","String","teks"],["🔢","Integer","bilangan bulat"],["📐","Float","bilangan desimal"],["✅","Boolean","True / False"]]);
  const linear=panel([["📦","Array","berurutan + indeks"],["🔗","Linked List","node berantai"],["📚","Stack","LIFO · tumpukan"],["🚶","Queue","FIFO · antrean"]]);
  const nonlin=panel([["🌳","Tree","bertingkat"],["🕸️","Graph","hubungan bebas"],["🔵","Node + garis hubungan","penyusun Tree dan Graph",true]]);

  const chip=(x,y,w,icon,name,sub,c,d)=>`<g class="cm-node" style="--d:${d}s">
    <rect x="${x}" y="${y}" width="${w}" height="56" rx="12" fill="#FFFFFF" stroke="${c.stroke}" stroke-width="1.6" filter="url(#cmShadow)"/>

let current=0;
const nav=document.getElementById("nav");
const slide=document.getElementById("slide");
const progress=document.getElementById("progress");
const counter=document.getElementById("counter");
const prev=document.getElementById("prev");
const next=document.getElementById("next");
const footerInfo=document.getElementById("footerInfo");
const app=document.querySelector(".app");
let redrawNodes=null;

function bindToggle(btn,cls,hideLabel,showLabel,hideIcon,showIcon){
 const lab=btn.querySelector(".tl"), ico=btn.querySelector(".ti");
 btn.onclick=()=>{
  const hidden=app.classList.toggle(cls);
  btn.setAttribute("aria-pressed",String(hidden));
  lab.textContent=hidden?showLabel:hideLabel;
  ico.textContent=hidden?showIcon:hideIcon;
 };
}
const sideBtn=document.getElementById("toggleSidebar");
bindToggle(sideBtn,"no-sidebar","Sembunyikan menu","Tampilkan menu","☰","☰");
// HP: tombol ☰ membuka menu geser (drawer), bukan menyembunyikan kolom
const isPhone=window.matchMedia("(max-width:850px)");
const desktopSideClick=sideBtn.onclick;
function setDrawer(open){
 app.classList.toggle("drawer-open",open);
 sideBtn.setAttribute("aria-expanded",String(open));
 if(open){const a=document.querySelector("#nav .active");if(a)a.scrollIntoView({block:"center"});}
}
sideBtn.onclick=e=>{isPhone.matches?setDrawer(!app.classList.contains("drawer-open")):desktopSideClick(e);};
document.getElementById("scrim").onclick=()=>setDrawer(false);
document.getElementById("drawerClose").onclick=()=>setDrawer(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")setDrawer(false);});
(isPhone.addEventListener?isPhone.addEventListener("change",()=>setDrawer(false)):isPhone.addListener(()=>setDrawer(false)));
bindToggle(document.getElementById("toggleTop"),"no-top","Sembunyikan bar atas","Tampilkan bar atas","⬆","⬇");
if(window.ResizeObserver){new ResizeObserver(()=>{if(redrawNodes)redrawNodes()}).observe(slide);}

function renderNav(){
 nav.innerHTML=slides.map((s,i)=>`
  <button class="${i===current?'active':''}" data-go="${i}">
   <span class="num">${String(i+1).padStart(2,"0")}</span><span>${s.short}</span>
  </button>`).join("");
 nav.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{goTo(Number(b.dataset.go));setDrawer(false);});
}
function render(){
 slide.innerHTML='<div class="slide-inner">'+slides[current].render()+'</div>';
 progress.style.width=((current+1)/slides.length*100)+"%";
 counter.textContent=(current+1)+" / "+slides.length;
 footerInfo.textContent=slides[current].title;
 prev.disabled=current===0;
 next.disabled=current===slides.length-1;
 next.textContent=current===slides.length-1?"Selesai":"Berikutnya →";
 renderNav();
 bindInteractions();
 slide.scrollTop=0;
}
function goTo(i){
 if(i<0||i>=slides.length)return;
 current=i;render();
}
prev.onclick=()=>goTo(current-1);
next.onclick=()=>goTo(current+1);

function bindQuiz(id,feedbackId){
 const box=document.getElementById(id), fb=document.getElementById(feedbackId);
 if(!box)return;
 box.querySelectorAll(".option").forEach(btn=>{
  btn.onclick=()=>{
   box.querySelectorAll(".option").forEach(x=>x.disabled=true);
   if(btn.dataset.correct==="true"){
    btn.classList.add("correct");fb.textContent="✅ Benar! Jawabanmu tepat.";
    fb.style.color="var(--accent)";
   }else{
    btn.classList.add("wrong");fb.textContent="❌ Belum tepat. Coba perhatikan kembali konsepnya.";
    fb.style.color="var(--danger)";
    const correct=box.querySelector('[data-correct="true"]');
    if(correct)correct.classList.add("correct");
   }
  };
 });
}
function bindInteractions(){
 redrawNodes=null;
 [["q1","fb1"],["q2","fb2"],["q3","fb3"],["q4","fb4"],["q5","fb5"],["q6","fb6"]].forEach(x=>bindQuiz(x[0],x[1]));

 const dataCards=document.querySelectorAll("#dataCards .data-card");
 const zones=document.querySelectorAll(".drop-zone");
 let dragged=null;
 dataCards.forEach(card=>{
   card.addEventListener("dragstart",()=>{dragged=card;});
   card.addEventListener("dragend",()=>{dragged=null; zones.forEach(z=>z.classList.remove("over"));});
 });
 zones.forEach(zone=>{
   zone.addEventListener("dragover",e=>{e.preventDefault();zone.classList.add("over");});
   zone.addEventListener("dragleave",()=>zone.classList.remove("over"));
   zone.addEventListener("drop",e=>{
     e.preventDefault(); zone.classList.remove("over");
     if(!dragged)return;
     const fb=document.getElementById("groupFb");
     if(dragged.dataset.type===zone.dataset.drop){
       zone.querySelector(".drop-items").appendChild(dragged);
       dragged.draggable=false;
       dragged.classList.add("correct");
       const remaining=document.querySelectorAll("#dataCards .data-card").length;
       if(remaining===0){
         fb.textContent="🎉 Hebat! Semua data sudah dikelompokkan dengan benar.";
         fb.style.color="var(--accent)";
       }else{
         fb.textContent="✅ Benar! Lanjutkan mengelompokkan kartu lainnya.";
         fb.style.color="var(--accent)";
       }
     }else{
       fb.textContent="❌ Belum tepat. Perhatikan bentuk/arti datanya.";
       fb.style.color="var(--danger)";
     }
   });
 });

 document.querySelectorAll(".case-card").forEach(card=>{
   card.querySelectorAll(".case-option").forEach(btn=>{
     btn.onclick=()=>{
       const fb=card.querySelector(".case-feedback");
       card.querySelectorAll(".case-option").forEach(b=>b.disabled=true);
       if(btn.dataset.value===card.dataset.answer){
         btn.classList.add("correct");
         fb.textContent="✅ Tepat!";
         fb.style.color="var(--accent)";
       }else{
         btn.classList.add("wrong");
         const right=card.querySelector('[data-value="'+card.dataset.answer+'"]');
         if(right)right.classList.add("correct");
         fb.textContent="❌ Coba lagi pada konsep berikutnya.";
         fb.style.color="var(--danger)";
       }
     };
   });
 });

 const ag=document.getElementById("arrayGame");
 if(ag){
  ag.querySelectorAll(".array-item").forEach(b=>b.onclick=()=>{
   const ans=document.getElementById("arrayAnswer"),fb=document.getElementById("arrayFb");
   if(b.dataset.index==="3"){
    ans.textContent="81";fb.textContent="🎉 Benar! Indeks 3 berisi nilai 81.";fb.style.color="var(--accent)";b.classList.add("correct");
   }else{
    fb.textContent="❌ Belum. Ingat, indeks dimulai dari 0.";fb.style.color="var(--danger)";
   }
  });
 }

 const board=document.getElementById("nodeGame");
 if(board){
  let selected=null;
  let edges=[];
  const svg=document.getElementById("nodeSvg");
  const status=document.getElementById("nodeStatus");
  const nodes=[...board.querySelectorAll(".node")];
  function pos(el){
   const r=board.getBoundingClientRect(),n=el.getBoundingClientRect();
   return {x:n.left-r.left+n.width/2,y:n.top-r.top+n.height/2};
  }
  function draw(){
   svg.innerHTML="";
   edges.forEach(([a,b])=>{
    const pa=pos(board.querySelector('[data-node="'+a+'"]')),pb=pos(board.querySelector('[data-node="'+b+'"]'));
    const l=document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("class","edge");l.setAttribute("x1",pa.x);l.setAttribute("y1",pa.y);l.setAttribute("x2",pb.x);l.setAttribute("y2",pb.y);svg.appendChild(l);
   });
   status.textContent="Terhubung: "+edges.length+" / 3";
   if(edges.length===3){
    status.textContent="🎉 Lengkap! A–B, B–C, C–D sudah terhubung.";
    status.style.color="var(--accent)";
   }
  }
  function norm(a,b){return a<b?a+"-"+b:b+"-"+a}
  nodes.forEach(n=>n.onclick=()=>{
   if(!selected){selected=n.dataset.node;n.classList.add("selected");return}
   const a=selected,b=n.dataset.node;
   if(a!==b&&!edges.some(e=>norm(e[0],e[1])===norm(a,b))){
    edges.push([a,b]);
   }
   nodes.forEach(x=>x.classList.remove("selected"));selected=null;draw();
  });
  redrawNodes=draw;
  const reset=document.getElementById("resetNodes");
  if(reset)reset.onclick=()=>{edges=[];selected=null;nodes.forEach(x=>x.classList.remove("selected"));status.style.color="";draw()};
  draw();
 }

 const restart=document.getElementById("restart");
 if(restart)restart.onclick=()=>goTo(0);
}

render();
})();
</script>

<script>
/* Safe fallback renderer: prevents a broken optional interaction from making
   the presentation blank. It uses the existing `slides` data and DOM. */
(function () {
  function findContainer() {
    return document.querySelector('#slides') ||
           document.querySelector('.slides') ||
           document.querySelector('[data-slides]') ||
           document.querySelector('main .content') ||
           document.querySelector('main');
  }

  function getSlideContainer() {
    const el = findContainer();
    if (!el) return null;
    return el;
  }

  function renderFallback() {
    try {
      if (!Array.isArray(window.slides) && typeof slides === 'undefined') return;
      const data = Array.isArray(window.slides) ? window.slides : slides;
      if (!Array.isArray(data) || !data.length) return;

      const container = getSlideContainer();
      if (!container) return;

      // If an existing renderer has already produced visible slide content,
      // leave it alone.
      const existing = container.querySelector('.slide, .slide-card, [data-slide]');
      if (existing && existing.textContent.trim()) return;

      const escapeHtml = (value) => String(value ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

      container.innerHTML = data.map((s, idx) => {
        const title = escapeHtml(s.title || ('Slide ' + (idx + 1)));
        const body = s.content ?? s.html ?? s.body ?? '';
        const bodyHtml = typeof body === 'string' ? body : escapeHtml(body);
        return `<section class="slide fallback-slide" data-slide="${idx}">
          <div class="card">
            <div class="eyebrow">SLIDE ${idx + 1}</div>
            <h1>${title}</h1>
            <div class="slide-content">${bodyHtml}</div>
          </div>
        </section>`;
      }).join('');

      const all = [...container.querySelectorAll('.fallback-slide')];
      all.forEach((el, idx) => {
        el.style.display = idx === 0 ? '' : 'none';
      });
    } catch (e) {
      console.error('Fallback renderer:', e);
    }
  }

  // Do not interfere with the existing application unless it fails.
  window.addEventListener('error', function (e) {
    console.error('Presentation JavaScript error:', e.error || e.message);
    setTimeout(renderFallback, 50);
  });

  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(renderFallback, 100);
  });
})();
</script>
